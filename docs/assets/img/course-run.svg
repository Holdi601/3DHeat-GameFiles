<text x="16" y="46" fill="#7ee787">$ python -m heat3d_gamefiles course lap.json --install &quot;C:\Games\BeamNG.drive&quot; -o course.glb --margin 30 --texture-size…</text>
<text x="16" y="64" fill="#d6d9df">lap: 120 samples, 50 m driven (BeamNG.drive)</text>
<text x="16" y="82" fill="#d6d9df">  on example_level: 100% of the lap lies on its terrain</text>
<text x="16" y="100" fill="#d6d9df">  cutting 30 m either side of the driving: 0.01 km2</text>
<text x="16" y="118" fill="#d6d9df"></text>
<text x="16" y="136" fill="#d6d9df">  what the ground is made of:</text>
<text x="16" y="154" fill="#d6d9df">      6,688 triangles  81.6%  terrain</text>
<text x="16" y="172" fill="#d6d9df">      1,504 triangles  18.4%  road</text>
<text x="16" y="190" fill="#d6d9df">  and modelled: 2 road triangles</text>
<text x="16" y="208" fill="#d6d9df"></text>
<text x="16" y="226" fill="#d6d9df">  baked 4 ground textures at 512 px (100 cm a pixel): 2 road decals and 1 modelled surfaces painted</text>
<text x="16" y="244" fill="#d6d9df"></text>
<text x="16" y="262" fill="#d6d9df">  placed on it (7 triangles of a 1,500,000 budget):</text>
<text x="16" y="280" fill="#d6d9df">          1 barriers</text>
<text x="16" y="298" fill="#d6d9df">          1 props</text>
<text x="16" y="316" fill="#d6d9df">          1 rocks</text>
