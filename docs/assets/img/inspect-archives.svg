<text x="16" y="208" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;44&#160;&#160;deflate&#160;levels/example_level/info.json</text>
<text x="16" y="226" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;600&#160;&#160;deflate&#160;levels/example_level/main.level.json</text>
<text x="16" y="244" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;python&#160;-m&#160;heat3d_gamefiles&#160;extract&#160;example_level.zip&#160;levels/example_level/info.json&#160;--out&#160;out\inf…</text>
