<text x="16" y="136" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;python&#160;-m&#160;heat3d_gamefiles&#160;list&#160;example_level.zip</text>
<text x="16" y="154" fill="#d6d9df" xml:space="preserve" style="white-space:pre">4&#160;entries</text>
