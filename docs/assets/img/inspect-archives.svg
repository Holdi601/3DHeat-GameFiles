<text x="16" y="100" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;holds&#160;&#160;&#160;&#160;&#160;&#160;2&#160;x&#160;.json,&#160;1&#160;x&#160;.ter,&#160;1&#160;x&#160;.cdae</text>
