<text x="273.0" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">cars --help</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13" xml:space="preserve">
<text x="16" y="46" fill="#7ee787">$ python -m heat3d_gamefiles cars --help</text>
<text x="16" y="64" fill="#d6d9df">usage: heat3d_gamefiles cars [-h] [-o OUT] [--game GAME]</text>
<text x="16" y="82" fill="#d6d9df"></text>
<text x="16" y="100" fill="#d6d9df">options:</text>
<text x="16" y="118" fill="#d6d9df">  -h, --help     show this help message and exit</text>
<text x="16" y="136" fill="#d6d9df">  -o, --out OUT  the file to write (default ./forza.h3dcars)</text>
<text x="16" y="154" fill="#d6d9df">  --game GAME    the game&#x27;s folder, if not the installed one found</text>
</g></svg>
